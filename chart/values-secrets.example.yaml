# ─────────────────────────────────────────────
#  Example secrets overlay — copy me!
#
#    cp chart/values-secrets.example.yaml chart/values-secrets.yaml
#
#  chart/values-secrets.yaml is gitignored. Fill in real values there, then
#  deploy with both files layered:
#
#    helm upgrade --install switchboard-chat ./chart \
#      -f chart/values.yaml \
#      -f chart/values-secrets.yaml
#
#  install.sh already does this automatically when values-secrets.yaml exists.
#  Never commit real credentials to values.yaml or to this example file.
# ─────────────────────────────────────────────

backend:
  secret:
    MONGO_USERNAME: root
    MONGO_PASSWORD: replace-with-a-real-password

frontend:
  secret:
    API_KEY: replace-with-a-real-key

mongodb:
  auth:
    rootUsername: root
    rootPassword: replace-with-a-real-password
