{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: {{ .Values.namespaces.app }}
spec:
  # Select all pods in the app namespace
  podSelector: {}
  policyTypes:
    - Ingress
  # No ingress rules = deny all ingress by default.
  # Explicit allow rules in the other network-policies/*.yaml templates open only required paths.
{{- end }}
