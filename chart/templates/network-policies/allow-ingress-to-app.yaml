{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-app
  namespace: {{ .Values.namespaces.app }}
spec:
  # Apply to both frontend and backend pods
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - {{ .Values.frontend.name }}
          - {{ .Values.backend.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Allow from the ingress controller's namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
      ports:
        - port: {{ .Values.frontend.port }}
          protocol: TCP
        - port: {{ .Values.backend.port }}
          protocol: TCP
{{- end }}
