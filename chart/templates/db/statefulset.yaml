apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.mongodb.name }}
  namespace: {{ .Values.namespaces.db }}
  labels:
    app: {{ .Values.mongodb.name }}
    {{- include "k8sbase.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.mongodb.name }}   # must match the headless service name
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.mongodb.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mongodb.name }}
    spec:
      containers:
        - name: {{ .Values.mongodb.name }}
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mongodb.port }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.name }}-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.name }}-secret
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.name }}-secret
                  key: MONGO_DATABASE
          volumeMounts:
            - name: {{ .Values.mongodb.name }}-data
              mountPath: /data/db
          resources:
            requests:
              memory: {{ .Values.mongodb.resources.requests.memory | quote }}
              cpu: {{ .Values.mongodb.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.mongodb.resources.limits.memory | quote }}
              cpu: {{ .Values.mongodb.resources.limits.cpu | quote }}
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.mongodb.name }}-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.mongodb.storage }}
        # Uses kind's default storage class (standard)
        # storageClassName: standard
