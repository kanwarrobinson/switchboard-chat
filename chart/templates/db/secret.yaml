apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mongodb.name }}-secret
  namespace: {{ .Values.namespaces.db }}
type: Opaque
# stringData is used here for readability in dev.
# In production, replace with Vault, sealed-secrets, or external-secrets-operator.
# Override mongodb.auth.* via chart/values-secrets.yaml — never edit real creds into values.yaml.
stringData:
  MONGO_ROOT_USERNAME: {{ .Values.mongodb.auth.rootUsername | quote }}
  MONGO_ROOT_PASSWORD: {{ .Values.mongodb.auth.rootPassword | quote }}
  MONGO_DATABASE: {{ .Values.mongodb.auth.database | quote }}
