apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongodb.name }}
  namespace: {{ .Values.namespaces.db }}
  labels:
    app: {{ .Values.mongodb.name }}
spec:
  # Headless service — clusterIP: None gives stable DNS per pod.
  # Pod DNS: {{ include "mongodb.dns" . }}
  clusterIP: None
  selector:
    app: {{ .Values.mongodb.name }}
  ports:
    - port: {{ .Values.mongodb.port }}
      targetPort: {{ .Values.mongodb.port }}
      protocol: TCP
