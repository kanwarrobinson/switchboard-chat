apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.name }}-secret
  namespace: {{ .Values.namespaces.app }}
type: Opaque
# stringData is used here for readability in dev.
# In production, replace with Vault, sealed-secrets, or external-secrets-operator.
# Override backend.secret.* via chart/values-secrets.yaml — never edit real creds into values.yaml.
stringData:
  MONGO_USERNAME: {{ .Values.backend.secret.MONGO_USERNAME | quote }}
  MONGO_PASSWORD: {{ .Values.backend.secret.MONGO_PASSWORD | quote }}
  MONGO_URI: {{ include "mongodb.uri" . | quote }}
