apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.frontend.name }}-secret
  namespace: {{ .Values.namespaces.app }}
type: Opaque
# Add frontend-specific secrets here as needed.
# In production, replace with Vault or sealed-secrets.
# Override frontend.secret.* via chart/values-secrets.yaml.
stringData:
  API_KEY: {{ .Values.frontend.secret.API_KEY | quote }}
