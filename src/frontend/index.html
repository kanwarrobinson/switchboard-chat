<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>k8s Base App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 560px;
      width: 100%;
      padding: 40px 24px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #334155;
      flex-shrink: 0;
    }

    .dot.ok    { background: #22c55e; }
    .dot.error { background: #ef4444; }
    .dot.pending { background: #f59e0b; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .label { color: #94a3b8; font-size: 0.875rem; }
    .value { color: #f1f5f9; font-size: 0.875rem; margin-left: auto; }

    pre {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 14px;
      font-size: 0.8rem;
      color: #94a3b8;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .error-text { color: #f87171; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>k8s Base App</h1>
    <p class="subtitle">Frontend → Backend → MongoDB</p>

    <div class="card">
      <div class="card-title">Service Status</div>
      <div class="status-row">
        <div class="dot ok"></div>
        <span class="label">Frontend</span>
        <span class="value">Running</span>
      </div>
      <div class="status-row" id="backend-row">
        <div class="dot pending" id="backend-dot"></div>
        <span class="label">Backend</span>
        <span class="value" id="backend-status">Checking...</span>
      </div>
      <div class="status-row" id="db-row">
        <div class="dot pending" id="db-dot"></div>
        <span class="label">MongoDB</span>
        <span class="value" id="db-status">Checking...</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Backend Response</div>
      <pre id="api-response">Loading...</pre>
    </div>
  </div>

  <script>
    async function checkBackend() {
      try {
        const res = await fetch('/api');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Backend status
        document.getElementById('backend-dot').className = 'dot ok';
        document.getElementById('backend-status').textContent = 'Connected';

        // DB status
        const dbOk = data.db === 'connected';
        document.getElementById('db-dot').className = dbOk ? 'dot ok' : 'dot error';
        document.getElementById('db-status').textContent = data.db;

        // Response
        document.getElementById('api-response').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('backend-dot').className = 'dot error';
        document.getElementById('backend-status').textContent = 'Unreachable';
        document.getElementById('db-dot').className = 'dot error';
        document.getElementById('db-status').textContent = 'Unknown';
        document.getElementById('api-response').innerHTML =
          `<span class="error-text">Error: ${err.message}</span>`;
      }
    }

    checkBackend();
  </script>
</body>
</html>
